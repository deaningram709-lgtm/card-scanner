<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="200" fill="#0f0f1a"/>
  <!-- Business card shape -->
  <rect x="180" y="280" width="664" height="400" rx="32" fill="#1a1a2e" stroke="#6c63ff" stroke-width="8"/>
  <!-- QR code pattern (stylized) -->
  <g fill="#6c63ff">
    <!-- Top-left finder -->
    <rect x="240" y="340" width="120" height="120" rx="8"/>
    <rect x="256" y="356" width="88" height="88" rx="4" fill="#1a1a2e"/>
    <rect x="276" y="376" width="48" height="48" rx="4" fill="#6c63ff"/>
    <!-- Top-right finder -->
    <rect x="600" y="340" width="120" height="120" rx="8"/>
    <rect x="616" y="356" width="88" height="88" rx="4" fill="#1a1a2e"/>
    <rect x="636" y="376" width="48" height="48" rx="4" fill="#6c63ff"/>
    <!-- Bottom-left finder -->
    <rect x="240" y="500" width="120" height="120" rx="8"/>
    <rect x="256" y="516" width="88" height="88" rx="4" fill="#1a1a2e"/>
    <rect x="276" y="536" width="48" height="48" rx="4" fill="#6c63ff"/>
    <!-- Data dots -->
    <rect x="400" y="340" width="40" height="40" rx="4"/>
    <rect x="460" y="340" width="40" height="40" rx="4"/>
    <rect x="520" y="340" width="40" height="40" rx="4"/>
    <rect x="400" y="400" width="40" height="40" rx="4"/>
    <rect x="460" y="400" width="40" height="40" rx="4"/>
    <rect x="400" y="460" width="40" height="40" rx="4"/>
    <rect x="520" y="460" width="40" height="40" rx="4"/>
    <rect x="460" y="520" width="40" height="40" rx="4"/>
    <rect x="520" y="520" width="40" height="40" rx="4"/>
    <rect x="600" y="500" width="40" height="40" rx="4"/>
    <rect x="660" y="500" width="40" height="40" rx="4"/>
    <rect x="600" y="560" width="40" height="40" rx="4"/>
    <rect x="660" y="560" width="40" height="40" rx="4"/>
    <rect x="520" y="400" width="40" height="40" rx="4"/>
  </g>
  <!-- Camera lens circle -->
  <circle cx="780" cy="760" r="80" fill="none" stroke="#6c63ff" stroke-width="10"/>
  <circle cx="780" cy="760" r="50" fill="#6c63ff" opacity="0.3"/>
  <circle cx="780" cy="760" r="25" fill="#6c63ff"/>
</svg>
